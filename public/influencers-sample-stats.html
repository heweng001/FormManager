<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>寄样统计 - LUJIFO跨境电商ERP系统</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <script src="/js/common.js"></script>
  <script>
    let datePreset = 'recent_30d';
    let customDateFrom = '';
    let customDateTo = '';
    let includeAllocationTag = false;
    let currentRange = null;

    const METRICS = [
      { key: 'audit_approved', label: '通过数', group: 'audit', linkType: 'pending', auditTab: 'approved', dateType: 'audit' },
      { key: 'audit_rejected', label: '拒绝数', group: 'audit', linkType: 'pending', auditTab: 'rejected', dateType: 'audit' },
      { key: 'audit_tentative', label: '待定数', group: 'audit', linkType: 'pending', auditTab: 'tentative', dateType: 'audit' },
      {
        key: 'approval_rate',
        label: '审核通过率',
        group: 'rate',
        linkType: null,
        help: '计算公式：通过数 ÷ (通过数 + 拒绝数 + 待定数) × 100%。分子分母均为所选时间段内按审核时间统计的申请 ID 数。',
      },
      {
        key: 'sample_count',
        label: '寄样数',
        group: 'sample',
        linkType: 'sample',
        help: '统计口径：所选寄样时间段内，该负责人对应达人的样品订单条数（每条样品订单计 1）。',
      },
      {
        key: 'ordered_influencer_count',
        label: '出单达人数',
        group: 'alliance',
        linkType: 'collaborated',
        help: '统计口径：在所选寄样时间段内已寄样的达人中，存在支付时间晚于寄样时间的联盟订单的达人数（按达人去重）。',
      },
      {
        key: 'video_count',
        label: '出单视频数',
        group: 'alliance',
        linkType: null,
        help: '统计口径：满足出单条件的联盟订单中，去重后的内容 ID 数量。',
      },
      {
        key: 'order_count',
        label: '出单数',
        group: 'alliance',
        linkType: 'alliance',
        help: '统计口径：满足出单条件的联盟订单条数（支付时间须晚于对应寄样时间）。',
      },
      {
        key: 'order_rate',
        label: '达人出单率',
        group: 'rate',
        linkType: null,
        help: '计算公式：出单达人数 ÷ 寄样数 × 100%。',
      },
      {
        key: 'avg_order_count',
        label: '平均出单数',
        group: 'rate',
        linkType: null,
        help: '计算公式：出单数 ÷ 寄样数，四舍五入保留 1 位小数。',
      },
    ];

    function renderMetricHeader(metric) {
      if (!metric.help) return escapeHtml(metric.label);
      return `<span class="erp-metric-head">${escapeHtml(metric.label)}<span class="erp-metric-help" tabindex="0" aria-label="${escapeAttr(metric.label + '说明：' + metric.help)}"><span class="erp-metric-help-icon" aria-hidden="true">i</span><span class="erp-metric-help-tip">${escapeHtml(metric.help)}</span></span></span>`;
    }

    async function init() {
      await requireLogin();
      document.title = '寄样统计 - LUJIFO跨境电商ERP系统';
      renderShell({
        active: 'influencers-sample-stats',
        breadcrumb: '一级菜单 / <strong>达人</strong> / <strong>寄样统计</strong>',
        meta: '按负责人汇总寄样与出单数据',
        content: `
          <div class="erp-page-header erp-page-header-compact">
            <h1 class="erp-page-title erp-page-title-inline">寄样统计<span class="erp-page-desc-inline"> — 按寄样时间筛选，统计审核、寄样及寄样后出单（北京时间）</span></h1>
          </div>
          <div class="erp-card erp-card-compact" style="margin-bottom:8px;">
            <div class="erp-card-body erp-card-body-compact">
              <div class="erp-toolbar erp-toolbar-compact erp-toolbar-wrap">
                <div class="erp-field"><label>寄样时间</label>
                  <select id="datePreset" class="erp-input">
                    <option value="recent_30d">最近30天</option>
                    <option value="last_month">上月</option>
                    <option value="year">今年</option>
                    <option value="custom">自定义</option>
                  </select>
                </div>
                <div class="erp-field erp-custom-date-field hidden" id="customFromField"><label>开始</label><input id="customDateFrom" class="erp-input" placeholder="YYYYMMDD" maxlength="8" /></div>
                <div class="erp-field erp-custom-date-field hidden" id="customToField"><label>结束</label><input id="customDateTo" class="erp-input" placeholder="YYYYMMDD" maxlength="8" /></div>
                <label class="erp-checkbox-label">
                  <input type="checkbox" id="includeAllocationTag" />
                  包含标签为「分配」的达人
                </label>
                <button id="searchBtn" class="erp-btn erp-btn-primary">查询</button>
                <div class="erp-toolbar-spacer"></div>
                <span id="rangeLabel" class="erp-meta"></span>
              </div>
            </div>
          </div>
          <div class="erp-card">
            <div class="erp-table-wrap">
              <table class="erp-table erp-table-sample-stats" id="sampleStatsTable">
                <thead id="sampleStatsHead">
                  <tr><th>负责人</th>${METRICS.map((m) => `<th class="erp-stats-group-${m.group}">${renderMetricHeader(m)}</th>`).join('')}</tr>
                </thead>
                <tbody id="sampleStatsBody"><tr><td colspan="${METRICS.length + 1}" class="erp-empty">加载中...</td></tr></tbody>
              </table>
            </div>
          </div>
        `,
      });
      bindEvents();
      loadStats();
    }

    function bindEvents() {
      document.getElementById('datePreset').addEventListener('change', toggleCustomDateFields);
      document.getElementById('includeAllocationTag').addEventListener('change', (e) => {
        includeAllocationTag = e.target.checked;
      });
      document.getElementById('searchBtn').addEventListener('click', () => {
        datePreset = document.getElementById('datePreset').value;
        customDateFrom = document.getElementById('customDateFrom').value.trim();
        customDateTo = document.getElementById('customDateTo').value.trim();
        includeAllocationTag = document.getElementById('includeAllocationTag').checked;
        loadStats();
      });
      toggleCustomDateFields();
    }

    function toggleCustomDateFields() {
      const preset = document.getElementById('datePreset').value;
      const show = preset === 'custom';
      document.querySelectorAll('.erp-custom-date-field').forEach((el) => el.classList.toggle('hidden', !show));
    }

    function buildQueryString() {
      const params = new URLSearchParams();
      params.set('date_preset', datePreset);
      if (datePreset === 'custom') {
        if (customDateFrom) params.set('date_from', customDateFrom);
        if (customDateTo) params.set('date_to', customDateTo);
      }
      if (includeAllocationTag) params.set('include_allocation_tag', '1');
      return params.toString();
    }

    function formatRatePercent(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return '-';
      return `${Number(value).toFixed(2)}%`;
    }

    function formatAvgOrderCount(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return '-';
      return Number(value).toFixed(1);
    }

    const EMPTY_ASSIGNEE_KEY = '__empty__';

    function formatAssigneeCellName(assignee) {
      if (assignee === EMPTY_ASSIGNEE_KEY) return '（负责人为空）';
      return assignee || '-';
    }

    function buildPendingLink(assignee, auditTab, dateType) {
      if (!currentRange) return '#';
      const params = new URLSearchParams();
      if (auditTab) params.set('audit_tab', auditTab);
      if (assignee) params.set('assignee', assignee);
      if (dateType === 'audit') {
        params.set('audit_date_from', currentRange.start);
        params.set('audit_date_to', currentRange.end);
      } else {
        params.set('sample_date_from', currentRange.start);
        params.set('sample_date_to', currentRange.end);
      }
      return `/influencers.html?${params.toString()}`;
    }

    function buildSampleOrdersLink(assignee) {
      if (!currentRange) return '#';
      const params = new URLSearchParams();
      if (assignee) params.set('assignee', assignee);
      params.set('sample_date_from', currentRange.start);
      params.set('sample_date_to', currentRange.end);
      return `/sample-orders.html?${params.toString()}`;
    }

    function buildAllianceLink(assignee) {
      if (!currentRange) return '#';
      const params = new URLSearchParams();
      if (assignee) params.set('assignee', assignee);
      params.set('sample_date_from', currentRange.start);
      params.set('sample_date_to', currentRange.end);
      params.set('payment_after_sample', '1');
      return `/alliance-orders.html?${params.toString()}`;
    }

    function buildCollaboratedLink(assignee) {
      if (!currentRange) return '#';
      const params = new URLSearchParams();
      if (assignee) params.set('assignee', assignee);
      params.set('collab_tab', 'all');
      params.set('ordered_after_sample', '1');
      params.set('sample_date_from', currentRange.start);
      params.set('sample_date_to', currentRange.end);
      return `/influencers-collaborated.html?${params.toString()}`;
    }

    function renderMetricCell(row, metric, assignee) {
      const value = row[metric.key];
      if (metric.key === 'approval_rate' || metric.key === 'order_rate') {
        return escapeHtml(formatRatePercent(value));
      }
      if (metric.key === 'avg_order_count') {
        return escapeHtml(formatAvgOrderCount(value));
      }
      const text = String(value ?? 0);
      if (!metric.linkType || assignee === '__total__') {
        return escapeHtml(text);
      }
      let href = '#';
      if (metric.linkType === 'pending') {
        href = buildPendingLink(assignee === '__total__' ? '' : assignee, metric.auditTab, metric.dateType);
      } else if (metric.linkType === 'sample') {
        href = buildSampleOrdersLink(assignee === '__total__' ? '' : assignee);
      } else if (metric.linkType === 'alliance') {
        href = buildAllianceLink(assignee === '__total__' ? '' : assignee);
      } else if (metric.linkType === 'collaborated') {
        href = buildCollaboratedLink(assignee === '__total__' ? '' : assignee);
      }
      return `<a href="${escapeAttr(href)}" class="erp-link-external erp-stats-link">${escapeHtml(text)}</a>`;
    }

    function renderTableBody(rows, emptyAssigneeRow, showEmptyAssigneeRow, staffTotals, grandTotals) {
      const tbody = document.getElementById('sampleStatsBody');
      const colCount = METRICS.length + 1;
      const displayRows = [...(rows || [])];
      if (showEmptyAssigneeRow && emptyAssigneeRow) {
        displayRows.push(emptyAssigneeRow);
      }
      if (!displayRows.length) {
        tbody.innerHTML = `<tr><td colspan="${colCount}" class="erp-empty">暂无统计数据</td></tr>`;
        return;
      }
      const bodyHtml = displayRows.map((row) => `
        <tr>
          <td class="cell-assignee-name">${escapeHtml(formatAssigneeCellName(row.assignee))}</td>
          ${METRICS.map((metric) => `<td class="erp-stats-value erp-stats-group-${metric.group}">${renderMetricCell(row, metric, row.assignee)}</td>`).join('')}
        </tr>
      `).join('');
      const grandTotalRow = `
        <tr class="erp-stats-total-row">
          <td class="cell-assignee-name"><strong>合计</strong></td>
          ${METRICS.map((metric) => `<td class="erp-stats-value erp-stats-group-${metric.group}"><strong>${renderMetricCell(grandTotals, metric, '__total__')}</strong></td>`).join('')}
        </tr>`;
      tbody.innerHTML = bodyHtml + grandTotalRow;
    }

    async function loadStats() {
      const tbody = document.getElementById('sampleStatsBody');
      const colCount = METRICS.length + 1;
      tbody.innerHTML = `<tr><td colspan="${colCount}" class="erp-empty">加载中...</td></tr>`;

      const { res, data } = await api(`/api/sample-shipment-stats?${buildQueryString()}`);
      if (!res.ok) {
        tbody.innerHTML = `<tr><td colspan="${colCount}" class="erp-empty">${escapeHtml(data.message || '加载失败')}</td></tr>`;
        return;
      }

      currentRange = data.range || null;
      document.getElementById('rangeLabel').textContent = currentRange?.label ? `当前：${currentRange.label}` : '';
      renderTableBody(
        data.rows || [],
        data.empty_assignee_row || null,
        !!data.show_empty_assignee_row,
        data.staff_totals || {},
        data.grand_totals || data.staff_totals || {}
      );
    }

    init();
  </script>
</body>
</html>
