<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>达人视频 - LUJIFO跨境电商ERP系统</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <script src="/js/order-columns.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const PAGE_SIZE = 50;
    const XLSX_ACCEPT = '.xlsx';
    const SORTABLE_FIELDS = ['import_time', 'order_count', 'refund_count'];
    let currentPage = 1;
    let totalPages = 1;
    let sortField = 'order_count';
    let sortOrder = 'desc';
    const tableColumns = INFLUENCER_VIDEO_DISPLAY_COLUMNS;
    let selectedFile = null;
    let importPanelOpen = false;
    const rowSelection = createBatchRowSelection({ deleteIdKey: 'video_ids' });

    let urlAssigneeFilter = '';
    let urlSampleDateFrom = '';
    let urlSampleDateTo = '';
    let urlPublishAfterSample = '';

    function buildAllianceOrdersLink(contentId, fullRefund = false) {
      const params = new URLSearchParams();
      params.set('content_id', contentId);
      if (fullRefund) params.set('full_refund', '1');
      return `/alliance-orders.html?${params.toString()}`;
    }

    function renderCreatorUsernameCell(row) {
      const id = String(row.creator_username || '').trim();
      const key = escapeAttr(id);
      const linkHtml = id ? renderInfluencerLink(id) : '<span class="erp-meta">-</span>';
      const trendBtn = id
        ? `<button type="button" class="erp-trend-btn" data-influencer-id="${key}" title="月度出单对比" aria-label="月度出单对比"><span class="erp-trend-icon" aria-hidden="true"></span></button>`
        : '';
      const viewBtn = id
        ? `<button type="button" class="erp-btn erp-btn-secondary erp-btn-view erp-btn-view-inline view-influencer-detail-btn" data-influencer-id="${key}">查看</button>`
        : '';
      return `<td class="cell-creator cell-truncate"><span class="erp-influencer-id-wrap"><span class="erp-influencer-id-cell">${linkHtml}${trendBtn}${viewBtn}</span></span></td>`;
    }

    function renderAllianceStatCell(row, field) {
      const contentId = String(row.content_id || '').trim();
      const count = Number(row[field]) || 0;
      const text = String(count);
      if (!contentId || count <= 0) {
        return `<td class="cell-stat">${escapeHtml(text)}</td>`;
      }
      const href = buildAllianceOrdersLink(contentId, field === 'refund_count');
      const title = field === 'refund_count' ? '查看已全部退款的联盟订单' : '查看联盟订单';
      return `<td class="cell-stat"><a href="${escapeAttr(href)}" class="erp-link-external" title="${escapeAttr(title)}">${escapeHtml(text)}</a></td>`;
    }

    function renderInfluencerVideoCell(row, column) {
      if (column.key === 'creator_username') return renderCreatorUsernameCell(row);
      if (column.key === 'order_count') return renderAllianceStatCell(row, 'order_count');
      if (column.key === 'refund_count') return renderAllianceStatCell(row, 'refund_count');
      return renderOrderTableCellHtml(row, column);
    }

    function renderTableHead() {
      const displayColumns = buildOrderDisplayColumns(tableColumns);
      const headers = displayColumns.map((column) => {
        const sortKey = column.key === ORDER_IMPORT_TIME_HEADER ? 'import_time' : column.key;
        if (SORTABLE_FIELDS.includes(sortKey)) {
          const label = column.key === ORDER_IMPORT_TIME_HEADER ? '导入时间' : (column.label || column.key);
          return `<th class="erp-sortable${column.key === ORDER_IMPORT_TIME_HEADER ? ' cell-import-time' : ''}" data-sort="${sortKey}">${escapeHtml(label)} <span class="erp-sort-indicator" data-field="${sortKey}">↕</span></th>`;
        }
        if (column.key === ORDER_IMPORT_TIME_HEADER) {
          return renderOrderImportTimeHeader();
        }
        return `<th>${escapeHtml(column.label || column.key)}</th>`;
      }).join('');
      const thead = document.getElementById('influencerVideoHead');
      thead.innerHTML = `<tr>${TABLE_SELECT_ALL_HEADER}${headers}</tr>`;
      rowSelection.setupSelectAllMenu();
      SORTABLE_FIELDS.forEach((field) => {
        document.querySelector(`.erp-sort-indicator[data-field="${field}"]`)?.closest('th')?.addEventListener('click', () => toggleSort(field));
      });
      updateSortIndicators();
    }

    function renderTableBody(rows) {
      const displayColumns = buildOrderDisplayColumns(tableColumns);
      const tbody = document.getElementById('influencerVideoBody');
      const colSpan = Math.max(displayColumns.length, 1) + 1;
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="${colSpan}" class="erp-empty">暂无记录</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map((row) => {
        return `
          <tr class="influencer-video-row" data-id="${row.id}" id="influencer-video-${row.id}">
            ${rowSelection.renderCheckboxCell(row.id)}
            ${displayColumns.map((column) => renderInfluencerVideoCell(row, column)).join('')}
          </tr>
        `;
      }).join('');
      rowSelection.bindRowCheckboxes();
      bindRowActions();
    }

    function bindRowActions() {
      document.querySelectorAll('.view-influencer-detail-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const influencerId = btn.dataset.influencerId;
          showInfluencerDetailModal({
            influencerId,
            defaultTab: 'collab',
            enableFollowUp: true,
          });
        });
      });
      document.querySelectorAll('.erp-trend-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          openTrendModal(btn.dataset.influencerId);
        });
      });
    }

    function updateSortIndicators() {
      document.querySelectorAll('#influencerVideoTable .erp-sort-indicator').forEach((el) => {
        const field = el.dataset.field;
        const active = field === sortField;
        el.textContent = active ? (sortOrder === 'asc' ? '↑' : '↓') : '↕';
        el.classList.toggle('active', active);
      });
    }

    function toggleSort(field) {
      if (sortField === field) sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
      else {
        sortField = field;
        sortOrder = 'desc';
      }
      currentPage = 1;
      rowSelection.resetSelection(false);
      loadVideos();
    }

    function formatTrendPct(pct) {
      const num = Number(pct) || 0;
      if (num > 0) return `<span class="erp-trend-pct up">+${num.toFixed(1)}%</span>`;
      if (num < 0) return `<span class="erp-trend-pct down">${num.toFixed(1)}%</span>`;
      return `<span class="erp-trend-pct flat">0.0%</span>`;
    }

    function renderTrendMetricCells(metrics, picker) {
      const keys = ['published_video_count', 'video_count', 'order_count', 'refund_count'];
      return keys.map((key) => `<td>${picker(metrics[key])}</td>`).join('');
    }

    function renderTrendTableBody(stats) {
      const metrics = stats.metrics || {};
      const rows = [
        ['历史总计', (metric) => escapeHtml(String(metric?.total ?? 0))],
        ['上月', (metric) => escapeHtml(String(metric?.last_month ?? 0))],
        ['本月', (metric) => escapeHtml(String(metric?.current_month ?? 0))],
        ['环比', (metric) => formatTrendPct(metric?.change_pct)],
      ];
      return rows.map(([label, picker]) => `
        <tr>
          <td>${escapeHtml(label)}</td>
          ${renderTrendMetricCells(metrics, picker)}
        </tr>
      `).join('');
    }

    async function openTrendModal(influencerId) {
      const modal = document.getElementById('trendModal');
      const body = document.getElementById('trendStatsBody');
      const meta = document.getElementById('trendModalMeta');
      if (!modal || !body) return;
      meta.textContent = `达人 id：${influencerId}`;
      body.innerHTML = '<tr><td colspan="5" class="erp-empty">统计中...</td></tr>';
      modal.classList.remove('hidden');
      const { res, data } = await api(`/api/collaborated/monthly-stats/${encodeURIComponent(influencerId)}`);
      if (!res.ok) {
        body.innerHTML = `<tr><td colspan="5" class="erp-empty">${escapeHtml(data.message || '加载失败')}</td></tr>`;
        return;
      }
      const stats = data.data;
      meta.textContent = `达人 id：${influencerId}（${stats.last_month_label || '上月'} vs ${stats.current_month_label || '本月'}）`;
      body.innerHTML = renderTrendTableBody(stats);
    }

    async function init() {
      await requireLogin();
      renderShell({
        active: 'influencer-videos',
        breadcrumb: '一级菜单 / <strong>导数据</strong> / <strong>达人视频</strong>',
        meta: '达人视频导入与查询',
        content: `
          <div class="erp-page-header erp-page-header-compact">
            <h1 class="erp-page-title erp-page-title-inline">达人视频<span class="erp-page-desc-inline"> — 仅支持 .xlsx；忽略前 2 行，从第 3 行起导入第 1–6 列</span></h1>
          </div>
          <div class="erp-card erp-card-compact" style="margin-bottom:8px;">
            <div class="erp-card-body erp-card-body-compact">
              <div class="erp-toolbar erp-toolbar-compact">
                <div class="erp-field"><label>内容 id</label><input id="filterContentId" class="erp-input" placeholder="关键词" autocomplete="off" readonly /></div>
                <div class="erp-field"><label>达人 id</label><input id="filterCreatorUsername" class="erp-input" placeholder="关键词" autocomplete="off" readonly /></div>
                <div class="erp-field"><label>导入时间</label><select id="filterImportTime" class="erp-input"><option value="">全部</option></select></div>
                <div class="erp-field"><label>发布开始</label><input id="filterPublishDateFrom" class="erp-input erp-date-input" type="date" /></div>
                <div class="erp-field"><label>发布结束</label><input id="filterPublishDateTo" class="erp-input erp-date-input" type="date" /></div>
                <button id="searchBtn" class="erp-btn erp-btn-primary">查询</button>
                <button id="resetBtn" class="erp-btn erp-btn-secondary">重置</button>
                <div class="erp-toolbar-spacer"></div>
                <button id="batchDeleteBtn" class="erp-btn erp-btn-secondary">批量删除</button>
                <button id="toggleImportBtn" class="erp-btn erp-btn-secondary">Excel 导入</button>
              </div>
              <div id="importPanel" class="erp-import-panel hidden">
                <div id="dropZone" class="erp-upload-zone compact">
                  <p class="erp-upload-title">拖拽或点击上传 .xlsx 文件</p>
                  ${renderImportColumnGuideHtml(INFLUENCER_VIDEO_COLUMNS, {
                    hideFieldKeys: true,
                    notes: [
                      '仅支持 .xlsx 格式。',
                      '忽略表格前 2 行，从第 3 行起读取数据。',
                      '仅导入第 1–6 列；内容 id（第 2 列）为唯一标识，重复记录将跳过。',
                    ],
                  })}
                  <input type="file" id="fileInput" accept="${XLSX_ACCEPT}" style="display:none" />
                </div>
                <p id="fileName" class="erp-meta hidden-text"></p>
                <div class="erp-toolbar" style="margin-top:8px;">
                  <button id="uploadBtn" class="erp-btn erp-btn-primary" disabled>开始导入</button>
                  <button id="cancelImportBtn" class="erp-btn erp-btn-secondary">收起</button>
                </div>
              </div>
            </div>
          </div>
          <div class="erp-card">
            <div class="erp-table-wrap">
              <table class="erp-table erp-table-influencer-videos" id="influencerVideoTable">
                <thead id="influencerVideoHead"><tr><th>加载中...</th></tr></thead>
                <tbody id="influencerVideoBody"><tr><td class="erp-empty">加载中...</td></tr></tbody>
              </table>
            </div>
            <div class="erp-pagination">
              <span id="pageInfo">第 1 / 1 页，共 0 条</span>
              <div class="erp-pagination-actions">
                <button id="prevPageBtn" class="erp-btn erp-btn-secondary" disabled>上一页</button>
                <button id="nextPageBtn" class="erp-btn erp-btn-secondary" disabled>下一页</button>
              </div>
            </div>
          </div>
          <div id="importModal" class="erp-modal-overlay hidden">
            <div class="erp-modal">
              <div class="erp-modal-header">导入完成</div>
              <div class="erp-modal-body"><p id="importMessage"></p></div>
              <div class="erp-modal-footer"><button id="importCloseBtn" class="erp-btn erp-btn-primary">确定</button></div>
            </div>
          </div>
          <div id="detailModal" class="erp-modal-overlay hidden">
            <div class="erp-modal erp-modal-wide">
              <div class="erp-modal-header">达人详情</div>
              <div class="erp-modal-body">
                <div class="erp-tabs erp-detail-modal-tabs" id="influencerDetailTabs">
                  <button type="button" class="erp-tab active" data-tab="audit">审核信息</button>
                  <button type="button" class="erp-tab" data-tab="collab">合作信息</button>
                  <button type="button" class="erp-tab" data-tab="followup">跟进记录</button>
                </div>
                <div id="detailAuditContent" class="erp-detail-stack"></div>
                <div id="detailCollabContent" class="erp-detail-grid hidden"></div>
                <div id="detailFollowUpContent" class="erp-detail-followup hidden"></div>
              </div>
              <div class="erp-modal-footer"><button id="detailCloseBtn" class="erp-btn erp-btn-primary">关闭</button></div>
            </div>
          </div>
          <div id="trendModal" class="erp-modal-overlay erp-trend-modal hidden">
            <div class="erp-modal">
              <div class="erp-modal-header">月度出单对比</div>
              <div class="erp-modal-body erp-trend-modal-body">
                <p id="trendModalMeta" class="erp-meta erp-trend-meta"></p>
                <table class="erp-table erp-trend-table" id="trendStatsTable">
                  <thead>
                    <tr>
                      <th>指标</th>
                      <th>发视频数</th>
                      <th>出单视频数</th>
                      <th>出单数</th>
                      <th>退款数</th>
                    </tr>
                  </thead>
                  <tbody id="trendStatsBody"><tr><td colspan="5" class="erp-empty">加载中...</td></tr></tbody>
                </table>
              </div>
              <div class="erp-modal-footer"><button id="trendCloseBtn" class="erp-btn erp-btn-primary">关闭</button></div>
            </div>
          </div>
        `,
      });
      bindEvents();
      setupFilterAutofillGuard(['filterContentId', 'filterCreatorUsername']);
      applyFiltersFromUrl();
      loadVideos();
    }

    function applyFiltersFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const creator = params.get('creator_username') || '';
      if (creator) document.getElementById('filterCreatorUsername').value = creator;
      const contentId = params.get('content_id') || '';
      if (contentId) document.getElementById('filterContentId').value = contentId;
      const publishFrom = params.get('publish_date_from') || '';
      const publishTo = params.get('publish_date_to') || '';
      if (publishFrom) document.getElementById('filterPublishDateFrom').value = ymdToDateInputValue(publishFrom);
      if (publishTo) document.getElementById('filterPublishDateTo').value = ymdToDateInputValue(publishTo);
      urlAssigneeFilter = params.get('assignee_filter') || '';
      urlSampleDateFrom = params.get('sample_date_from') || '';
      urlSampleDateTo = params.get('sample_date_to') || '';
      urlPublishAfterSample = params.get('publish_after_sample') === '1' ? '1' : '';
    }

    function getBatchFilters() {
      const { page, pageSize, import_time, sort_field, sort_order, ...filters } = getFilters();
      return filters;
    }

    function getFilters() {
      return {
        content_id: document.getElementById('filterContentId').value.trim(),
        creator_username: document.getElementById('filterCreatorUsername').value.trim(),
        publish_date_from: dateInputValueToYmd(document.getElementById('filterPublishDateFrom').value),
        publish_date_to: dateInputValueToYmd(document.getElementById('filterPublishDateTo').value),
        import_time: document.getElementById('filterImportTime').value.trim(),
        assignee_filter: urlAssigneeFilter,
        sample_date_from: urlSampleDateFrom,
        sample_date_to: urlSampleDateTo,
        publish_after_sample: urlPublishAfterSample,
        sort_field: sortField,
        sort_order: sortOrder,
        page: currentPage,
        pageSize: PAGE_SIZE,
      };
    }

    function buildQueryString(filters) {
      const params = new URLSearchParams();
      Object.entries(filters).forEach(([k, v]) => {
        if (v !== '' && v != null) params.set(k, String(v));
      });
      const q = params.toString();
      return q ? `?${q}` : '';
    }

    async function loadImportTimeFilterOptions() {
      const { res, data } = await api(`/api/influencer-videos/filter-options${buildQueryString(getBatchFilters())}`);
      if (!res.ok) return;
      populateOrderImportTimeFilter(
        document.getElementById('filterImportTime'),
        data.import_times || [],
        document.getElementById('filterImportTime').value
      );
    }

    async function loadVideos() {
      renderTableHead();
      await loadImportTimeFilterOptions();
      const { res, data } = await api(`/api/influencer-videos${buildQueryString(getFilters())}`);
      const tbody = document.getElementById('influencerVideoBody');
      const colSpan = Math.max(buildOrderDisplayColumns(tableColumns).length, 1) + 2;
      if (!res.ok) {
        tbody.innerHTML = `<tr><td colspan="${colSpan}" class="erp-empty">加载失败</td></tr>`;
        return;
      }

      totalPages = data.totalPages || 1;
      document.getElementById('pageInfo').textContent = `第 ${data.page} / ${totalPages} 页，本页 ${(data.data || []).length} 条，共 ${data.total || 0} 条`;
      document.getElementById('prevPageBtn').disabled = data.page <= 1;
      document.getElementById('nextPageBtn').disabled = data.page >= totalPages;
      renderTableBody(data.data || []);
      rowSelection.setLoadedRows(data.data || [], data.total || 0);
    }

    async function submitBatchDelete() {
      const count = rowSelection.getSelectedCount();
      if (!count) return alert('请先勾选要删除的记录');
      if (!confirm(`确定要删除选中的 ${count} 条达人视频吗？此操作不可恢复。`)) return;

      const btn = document.getElementById('batchDeleteBtn');
      btn.disabled = true;
      const oldText = btn.textContent;
      btn.textContent = '删除中...';
      try {
        const { res, data } = await api('/api/influencer-videos/batch-delete', {
          method: 'POST',
          body: JSON.stringify(rowSelection.buildDeletePayload(getBatchFilters)),
        });
        if (!res.ok) return alert(data.message || '删除失败');
        alert(`已成功删除 ${data.deleted} 条记录`);
        rowSelection.resetSelection(false);
        loadVideos();
      } finally {
        btn.disabled = false;
        btn.textContent = oldText;
      }
    }

    function toggleImportPanel(forceOpen) {
      const panel = document.getElementById('importPanel');
      const btn = document.getElementById('toggleImportBtn');
      importPanelOpen = typeof forceOpen === 'boolean' ? forceOpen : !importPanelOpen;
      panel.classList.toggle('hidden', !importPanelOpen);
      btn.textContent = importPanelOpen ? '收起导入' : 'Excel 导入';
    }

    function resetImportForm() {
      selectedFile = null;
      const fileInput = document.getElementById('fileInput');
      if (fileInput) fileInput.value = '';
      const fileName = document.getElementById('fileName');
      if (fileName) {
        fileName.textContent = '';
        fileName.classList.add('hidden-text');
      }
      document.getElementById('uploadBtn').disabled = true;
    }

    function isAllowedXlsxFile(file) {
      return file && String(file.name || '').toLowerCase().endsWith('.xlsx');
    }

    function handleFile(file) {
      if (!file) return;
      if (!isAllowedXlsxFile(file)) return alert('仅支持 .xlsx 格式');
      selectedFile = file;
      document.getElementById('fileName').textContent = '已选择：' + file.name;
      document.getElementById('fileName').classList.remove('hidden-text');
      document.getElementById('uploadBtn').disabled = false;
    }

    async function uploadFile() {
      if (!selectedFile) return;
      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      btn.textContent = '导入中...';
      const formData = new FormData();
      formData.append('file', selectedFile);
      let succeeded = false;
      try {
        const res = await fetch('/api/influencer-videos/upload', { method: 'POST', body: formData, credentials: 'same-origin' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          alert(data.message || '导入失败');
          return;
        }
        succeeded = true;
        let msg = data.message || `新增 ${data.inserted} 条，跳过重复 ${data.skipped || 0} 条`;
        if (data.duplicateKeys?.length) {
          const preview = data.duplicateKeys.slice(0, 8).join('、');
          const suffix = data.duplicateKeys.length > 8 ? ` 等 ${data.duplicateKeys.length} 项` : '';
          msg += `\n\n重复的内容 id：${preview}${suffix}`;
        }
        document.getElementById('importMessage').textContent = msg;
        document.getElementById('importModal').classList.remove('hidden');
      } catch {
        alert('导入失败，请稍后重试');
      } finally {
        btn.disabled = false;
        btn.textContent = '开始导入';
        if (succeeded) {
          resetImportForm();
          toggleImportPanel(false);
          loadVideos();
        }
      }
    }

    function bindEvents() {
      document.getElementById('toggleImportBtn').addEventListener('click', () => toggleImportPanel());
      document.getElementById('cancelImportBtn').addEventListener('click', () => { resetImportForm(); toggleImportPanel(false); });
      document.getElementById('dropZone').addEventListener('click', () => document.getElementById('fileInput').click());
      document.getElementById('fileInput').addEventListener('change', (e) => handleFile(e.target.files[0]));
      document.getElementById('uploadBtn').addEventListener('click', uploadFile);
      document.getElementById('batchDeleteBtn').addEventListener('click', submitBatchDelete);
      document.getElementById('searchBtn').addEventListener('click', () => { currentPage = 1; rowSelection.resetSelection(false); loadVideos(); });
      document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('filterContentId').value = '';
        document.getElementById('filterCreatorUsername').value = '';
        document.getElementById('filterImportTime').value = '';
        document.getElementById('filterPublishDateFrom').value = '';
        document.getElementById('filterPublishDateTo').value = '';
        urlAssigneeFilter = '';
        urlSampleDateFrom = '';
        urlSampleDateTo = '';
        urlPublishAfterSample = '';
        sortField = 'order_count';
        sortOrder = 'desc';
        currentPage = 1;
        rowSelection.resetSelection(false);
        loadVideos();
      });
      document.getElementById('prevPageBtn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; loadVideos(); } });
      document.getElementById('nextPageBtn').addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; loadVideos(); } });
      document.getElementById('importCloseBtn').addEventListener('click', () => {
        document.getElementById('importModal').classList.add('hidden');
        currentPage = 1;
        loadVideos();
      });
      document.getElementById('trendCloseBtn')?.addEventListener('click', () => {
        document.getElementById('trendModal')?.classList.add('hidden');
      });
      document.getElementById('trendModal')?.addEventListener('click', (e) => {
        if (e.target.id === 'trendModal') e.target.classList.add('hidden');
      });
      ['filterContentId', 'filterCreatorUsername'].forEach((id) => {
        document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') { currentPage = 1; rowSelection.resetSelection(false); loadVideos(); } });
      });
      document.getElementById('filterImportTime').addEventListener('change', () => { currentPage = 1; rowSelection.resetSelection(false); loadVideos(); });
    }

    init();
  </script>
</body>
</html>
